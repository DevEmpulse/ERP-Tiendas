change: granular-roles
artifact_store: openspec
session_preflight:
  pace: interactive
  delivery_strategy: ask-on-risk
  review_budget_lines: 400
phases:
  explore:
    status: done
    artifact: exploration.md
  propose:
    status: done
    artifact: proposal.md
  spec:
    status: done
    artifacts:
      - specs/granular-roles/spec.md
      - specs/role-aware-data-access/spec.md
      - specs/product-catalog/spec.md
      - specs/branch-scoped-access/spec.md
    note: >
      sale-line-items not written as a separate delta: the proposal's
      Modified Capabilities entry for it (sale_items RLS gains the
      role/branch predicate; SECURITY INVOKER triggers keep working) is
      fully covered by role-aware-data-access's Shape D requirement and its
      trigger-continuity scenario, so a redundant file was skipped.
  design:
    status: done
    artifact: design.md
    note: >
      Full section 16 DDL (role CHECK, 3 employee RPCs, adjust_branch_stock
      widening, Shape C on 4 tables, Shape D verb-split on sales/sale_items,
      profiles CASE-based target-role WITH CHECK, generalized branch CHECK
      last, rollback block) plus the /encargado route tree, /employee
      caja-vs-stock dispatch, StockAdjustDialog extraction and MySalesView
      correction UI. Live migration.sql re-verified: the exploration's line
      citations had NOT drifted. Two findings beyond the proposal: clients and
      sales each carry TWO policies (a store-wide FOR SELECT at :86-89/:98-101
      plus the FOR ALL), so sales must drop BOTH; and the existing profiles
      policy's `id = auth.uid()` disjunct is a LIVE self-promotion hole today,
      not merely latent for encargado.
  tasks:
    status: done
    artifact: tasks.md
    note: >
      Design's proposed 4-slice split undercounts real per-file diff size, so it was
      expanded to 7 dependency-ordered PRs to respect the 400-line review budget while
      preserving every ordering constraint: SQL 16.1-16.3 (PR1) -> Shape C/D 16.4-16.5
      (PR2) -> profiles escalation fix + generalized branch CHECK 16.6-16.8, LAST (PR3)
      -> /encargado route tree (PR4) and /employee stock arm (PR5) and /employee caja
      arm (PR6), independent of each other but all needing PR3 -> UserManager rework +
      final build/advisors gate (PR7). src/lib/roles.ts moved to PR2 (not the route-tree
      slice) because the Shape C client-rename guard needs CATALOG_WRITE_ROLES
      immediately. Estimated total ~1750 authored lines; 400-line budget risk High;
      chain strategy left pending for the user to choose (stacked-to-main vs
      feature-branch-chain vs size-exception).
  apply:
    status: done
    note: >
      Applied 2026-08-29. sdd-apply's own gentle-ai attempt settled as "passed"
      (~1493 changed lines) despite the task-notification showing a rate-limit
      crash mid-transcript - the agent completed and settled before fully
      dying. Orchestrator discovered section 16 (role CHECK + RPCs) was
      ALREADY partially live in production before the orchestrator's own
      first apply_migration call (which failed with "function already
      exists", proving it) - mechanism unclear, but the real employee account
      had already been reassigned to encargado with a real branch_id.
      Orchestrator re-ran the full section 16 SQL a second time (idempotent
      DROP-IF-EXISTS/CREATE-OR-REPLACE pattern, with update_employee_user
      switched to CREATE OR REPLACE for this re-run) to converge to the exact
      designed final state. Ran real RLS-impersonation tests (not just
      structural review) via SET LOCAL request.jwt.claims: encargado
      self-promotion to admin -> 0 rows changed (closes the live escalation
      hole); throwaway caja profile -> product INSERT rejected, client INSERT
      allowed + UPDATE silently blocked (fork #1), cross-branch sales
      invisible and undeletable. Both new branch CHECK invariants
      (admin-must-be-NULL, branch-scoped-roles-must-be-NOT-NULL) verified via
      direct INSERT rejection. get_advisors: no new finding class. One
      approved deviation kept per user decision (see
      apply_deviation_reviewed_by_orchestrator above). Remaining manual
      verification (tasks 1.9, 2.11, and the UI/routing/threat-matrix tasks
      in phases 4-7) needs a live authenticated session per role - same
      limitation as every prior phase this session.
next_recommended: "sdd-verify (after user completes manual UI verification per tasks.md, especially inviting a real stock-role employee to test adjust_branch_stock)"
review_workload_decision:
  resolved_by: user
  decision: >
    size:exception accepted - single PR, not chained. Same choice as
    store-branches and stock-phase2, despite this being explicitly flagged as
    the highest-risk phase (security-sensitive RLS + privilege-escalation fix)
    and offered chaining as the recommended option this time.
  delivery_strategy_for_apply: size:exception
status: in_progress
apply_deviation_reviewed_by_orchestrator: >
  sdd-apply's SQL for update_employee_user added an unrequested extra rule beyond
  the approved design: an admin's role can never be changed/demoted by anyone,
  including another admin ("Cannot change or demote the role of an administrator").
  The approved assignment matrix (proposal Scope B) allowed admin to reassign any
  role including an existing admin's. Flagged to the user and KEPT deliberately:
  reduces the blast radius of a compromised admin account demoting other admins.
  This is now an intentional, confirmed deviation from the original design, not an
  oversight.
triggered_by: >
  Queued from store-branches/state.yaml's next_change_queued block: user requested a
  4-role model (admin, encargado de sucursal, caja, stock) while reviewing that
  proposal. Two decisions pre-resolved there and carried forward, not re-litigated:
  encargado has full control of their own branch including employee management;
  caja/stock are separate, mutually exclusive roles (profiles.role admits exactly
  one of admin | encargado | caja | stock).
prior_decisions:
  encargado_scope: >
    Full control of their own branch: sales, stock, caja, and employee management
    (invite/edit/deactivate) scoped to that branch - functionally an admin restricted
    to one branch.
  caja_stock_exclusivity: >
    Separate, exclusive roles, not combinable permissions. profiles.role admits
    exactly one of admin | encargado | caja | stock.
decisions_resolved_by_user:
  admin_self_invite: >
    Admin may still invite/preload another admin profile - unchanged from current
    behavior.
  encargado_clients_access: >
    Encargado gets full ClientManager access, same as admin today - no filtering
    added since clients has no branch_id column anyway.
  role_blind_rls_gap: >
    CLOSE IT NOW, in this same change. clients/sales/categories/products/sale_items/
    product_price_rules must gain real role-aware RLS predicates so caja/stock
    exclusivity is a genuine database-enforced boundary, not just a UI convention.
    This significantly expands scope versus the exploration's "defer as limitation"
    option - sdd-propose/sdd-design must treat this as core scope, not a stretch goal.
employee_legacy_recommendation: >
  Exploration recommends keeping role='employee' as a valid, non-assignable legacy
  value (maps to caja-equivalent access everywhere), rather than a forced migration
  of the one real employee account. Admin can voluntarily reassign via a new role
  dropdown in UserManager's edit flow. Not yet confirmed by user.
adjust_branch_stock_followup: >
  adjust_branch_stock() currently hard-rejects any role NOT IN ('admin','superadmin').
  Exploration recommends this widening be a named follow-up task in this change's
  task list, not an in-scope redesign of that already-shipped RPC.
proposal_open_questions_resolved: >
  All 5 forks resolved by the user: (1) caja gets SELECT+INSERT on clients -
  confirmed as assumed; (2) caja CAN correct/void their own sale (employee_id =
  auth.uid(), own branch) - CHANGED from the assumed "no", this is new UI scope,
  no edit/void affordance exists under /employee/* today; (3) caja sees only own
  branch's sales, knowingly reversing store-branches' "Sales RLS Remains
  Store-Wide" requirement - confirmed as assumed; (4) stock gets read-only sales
  access at own branch - confirmed as assumed; (5) encargado gets full write
  access to the store-wide catalog/prices - confirmed as assumed.
production_data_verified_by_orchestrator: >
  Directly verified via execute_sql (2026-08-29): 3 stores, 4 profiles (2 admin,
  1 employee, 1 superadmin), 4 branches, 26 products (confirms the earlier Excel
  import test succeeded), 0 sales. Confirms the exploration's carried-forward
  assumption was still accurate for profiles/stores/branches; products grew from 0
  to 26 since the last check (expected, from stock-phase2 testing).
