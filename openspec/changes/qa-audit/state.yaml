change: qa-audit
artifact_store: openspec
session_preflight:
  pace: interactive
  delivery_strategy: ask-on-risk
  review_budget_lines: 400
phases:
  explore:
    status: done
    artifact: exploration.md
    note: >
      sdd-explore agent had no Bash or Write tool access this run; exploration
      content was returned inline and persisted to exploration.md by the
      orchestrator verbatim. Orchestrator independently re-ran npm run build
      and npm run lint (the agent could only reconstruct these from a prior
      phase's stale notes) - see key_findings.build_lint_reverified below for
      the corrected, current numbers.
  apply:
    status: done
    artifact: tasks.md
    note: >
      Ran directly from exploration.md/state.yaml's fully-narrowed scope
      (fork_1_remediation_scope resolved to Approach 1, documentation-only +
      tracked debt ledger) without separate spec/design phases, since the
      orchestrator's launch prompt already specified exact scope, files, and
      acceptance criteria equivalent to a spec+design+tasks artifact set for
      this narrow docs+lint pass. Fixed docs/database.md (removed duplicate
      stale profiles section, corrected sales.branch_id RLS claim, replaced
      dead sales-form.tsx reference, added missing analytics §18-20
      documentation) and docs/features.md (rewrote sale-entry section for
      /pos, removed false payment-breakdown claim, added /analytics section).
      Fixed all 19 lint problems across 11 files (9x
      react-hooks/set-state-in-effect via scoped eslint-disable comments
      matching the existing convention, 2x react/no-unescaped-entities, 1x
      no-explicit-any via the analytics.ts SupabaseClient type pattern, 1x
      missing exhaustive-deps fixed by adding a stable toast dependency, 3x
      missing exhaustive-deps intentionally left disabled because
      createClient() returns a fresh client per render, 3x unused imports
      removed). npm run lint: 0 problems (was 19). npm run build: passes
      clean, 0 TypeScript errors, all 13 routes generate. No migration.sql,
      RLS, or production data change of any kind - fork_3 and the FK cascade
      finding remain deliberately deferred debt, documented in tasks.md.
next_recommended: "sdd-verify"
triggered_by: >
  Phase 8, the FINAL phase of the original multi-phase roadmap defined in
  openspec/changes/archive/2026-08-28-stock-phase1-catalog/proposal.md. All
  other phases (P1-P7, plus the unplanned store-branches insertion) are
  applied to production. This is a cross-cutting audit phase, not a new
  feature - it reviews everything already shipped for regressions,
  inconsistencies, and unverified risk.
key_findings:
  build_lint_reverified: >
    Orchestrator re-ran both commands directly (the explore agent could not).
    npm run build: passes clean, 0 TypeScript errors, all 13 routes including
    /pos and /analytics generate successfully. npm run lint: 19 problems (12
    errors, 7 warnings) - MORE severe than prior phases' apply notes assumed.
    The recurring react-hooks/set-state-in-effect pattern (calling setState
    synchronously inside a useEffect body - the common "sync activeSection
    from a URL query param on mount" convention used throughout this
    codebase's dashboards) is flagged as an ESLint ERROR in this project's
    config, not a warning as every prior phase's apply note described it.
    Exact current list: app/admin/page.tsx:83, app/encargado/page.tsx:61,
    components/admin/ProductImportDialog.tsx:201,
    components/employee/MySalesView.tsx:151,
    components/employee/StockAdjustmentView.tsx:154,
    components/employee/employee-dashboard.tsx:54,
    components/pos/ProductPicker.tsx:44,
    components/shared/CashSessionStatusBadge.tsx:26,
    components/stock/StockAdjustDialog.tsx:59 (9 instances of this one
    error class, same pattern everywhere). Additional distinct issues:
    StockAdjustmentView.tsx:382 x2 (react/no-unescaped-entities, unescaped
    quote), salesHelper.ts:243 (@typescript-eslint/no-explicit-any),
    MySalesView.tsx:148 (react-hooks/exhaustive-deps, missing 'toast' dep),
    PosShell.tsx:29 (unused 'homeFor' import),
    PosShell.tsx:118/137/170 (react-hooks/exhaustive-deps, missing
    'supabase' dep x3), StockView.tsx:97 (unused 'AdjustReason' type
    import), MySalesView.tsx:18 (unused 'Calendar' icon import). npm run
    build succeeding despite these lint errors confirms this project's build
    step does not gate on lint (separate tooling), which is why none of this
    has blocked any prior phase's ship.
  scope_mismatch_bug_class_not_recurring: >
    Confirmed via independent grep: EmployeeReport.tsx's fixed bug
    (profiles store-wide RLS + sales branch-scoped RLS combined without
    scope alignment) does not recur anywhere else in the codebase. The only
    two other profiles+branch-scoped-table combinations (admin/page.tsx,
    encargado/page.tsx) are safe by construction (admin-only store-wide
    context, or self-profile-only lookup).
  security_definer_revoke_gap: >
    Only close_cash_session and every stock-phase2/analytics-era SECURITY
    DEFINER function has an explicit REVOKE EXECUTE FROM PUBLIC, anon.
    delete_employee_user, update_employee_user, preload_employee, and the
    three get_current_user_* helpers never received this treatment -
    undocumented drift against this codebase's own established pattern, not
    a confirmed exploit (internal auth.uid() checks fail closed for anon).
  docs_staleness: >
    docs/database.md has a duplicate, contradictory profiles table section
    (old 3-role CHECK at line ~16-24 vs correct 6-role CHECK at ~229-237), a
    stale claim that sales RLS is store-wide (line ~53, contradicted by the
    correct table at ~250), a dead sales-form.tsx reference (line ~150), and
    zero mention of the entire section 18-19 analytics SQL surface.
    docs/features.md still describes sales-form.tsx as owning sale entry
    (never mentions /pos), repeats the already-once-flagged-and-still-false
    payment-method-breakdown claim (line ~88-89), and has no /analytics
    section at all.
  fk_cascade_inconsistency: >
    profiles.branch_id/sales.branch_id reference branches(id) with no
    ON DELETE clause (defaults to NO ACTION), while branch_stock/
    stock_movements/cash_sessions/cash_movements all CASCADE against
    branches (store_id, id). Dormant risk only - zero code path hard-deletes
    a branch today (soft-delete via is_active only); would matter only if a
    future feature added real branch deletion.
  manual_verification_debt: >
    pos-ui/tasks.md's T1-T6 checkboxes show unchecked despite state.yaml
    recording the work as applied and build-verified (checkbox drift, not
    necessarily undone work) - but the 12-item live E2E checklist (T6.7,
    barcode scan/split-payment/receipt/stock-clamp) has never actually been
    run since /pos first shipped. analytics/tasks.md has 6 correctly-tagged
    outstanding [VERIFY] items needing a live browser session (branch-switch
    KPI recompute, EmployeeReport role check, /analytics role redirects,
    panel branch-filtering, low-stock regression with the new min_stock=8
    default, PDF export content).
open_forks_for_propose:
  fork_1_remediation_scope: >
    RESOLVED (this phase, by the user): Approach 1, documentation-only fix +
    tracked debt ledger, first. docs/database.md and docs/features.md
    staleness fixed; production RLS grants and the FK cascade inconsistency
    were initially left as deliberately deferred debt, then the user asked
    to close both out later the same session - see fork_3_security_definer_
    revoke and fk_cascade_resolution below for how they were closed.
  fork_2_lint_debt: >
    RESOLVED (this phase): fixed each of the 9 react-hooks/set-state-in-effect
    occurrences individually with a scoped inline eslint-disable comment,
    matching this codebase's existing convention (CashSessionPanel.tsx/
    CashSessionHistoryView.tsx/AnalyticsShell.tsx). All other lint issues
    (unescaped entities, no-explicit-any, exhaustive-deps, unused imports)
    fixed directly - see tasks.md Phase 3. npm run lint: 0 problems.
  fork_3_security_definer_revoke: >
    RESOLVED 2026-08-30, on explicit user request after the phase originally
    closed. Added migration.sql section 21.1: REVOKE EXECUTE ... FROM PUBLIC,
    anon + GRANT ... TO authenticated for delete_employee_user(uuid),
    update_employee_user(uuid,text,text,uuid,text), and
    preload_employee(text,text,text,uuid,uuid) - applied to production via
    apply_migration (revoke_execute_employee_management_rpcs), success true.
    Verified via get_advisors(security): all three functions no longer
    appear in the anon_security_definer_function_executable list (anon's
    count dropped from 8 to 5 - only the read-only get_current_user_*/
    handle_new_user/rls_auto_enable helpers remain, left untouched as
    genuinely lower-risk/no-arg). They still correctly appear in
    authenticated_security_definer_function_executable (expected - that's
    the intentional GRANT).
  fk_cascade_resolution: >
    RESOLVED 2026-08-30, same request. Fixed via migration.sql section 21.2:
    changed stock_movements_store_id_branch_id_fkey and
    cash_movements_store_id_branch_id_fkey from ON DELETE CASCADE to ON
    DELETE RESTRICT (queried production's actual pg_constraint definitions
    first via execute_sql to get the exact auto-generated constraint names
    rather than guessing). Deliberately did NOT touch branch_stock/
    cash_sessions/profiles/sales - only the two tables explicitly documented
    as immutable append-only audit ledgers (stock_movements, cash_movements)
    needed protection from a hypothetical future branch hard-delete
    silently destroying their history; profiles/sales were already safely
    NO ACTION by default. Applied to production via apply_migration
    (protect_audit_ledgers_from_branch_cascade), success true. Verified via
    execute_sql reading pg_constraint directly: both constraints now show
    "ON DELETE RESTRICT". Dormant fix - no code path hard-deletes a branch
    today, so nothing currently running is affected.
production_data_last_verified: >
  Re-verified 2026-08-30 after closing fork_3/fk_cascade: both fixes
  confirmed live in production via get_advisors and direct pg_constraint
  reads, not just apply_migration's success:true response.
orchestrator_independent_verification: >
  Completed 2026-08-30. Re-ran npm run build (clean, 0 errors, all 13 routes)
  and npm run lint (0 problems, confirmed down from 19) independently after
  the apply pass, not just trusting the agent's self-report. Spot-checked
  src/lib/salesHelper.ts's any->SupabaseClient fix (correct, matches
  analytics.ts's established pattern exactly, no behavior change). Read the
  full docs/database.md diff: the duplicate stale profiles section is gone,
  the surviving section (line ~219) has the correct 6-role CHECK, the sales
  RLS claim now correctly describes Forma D, the analytics section is
  accurate against the real SQL. This phase's in-scope work (docs + lint) is
  independently confirmed correct and complete.
status: applied
